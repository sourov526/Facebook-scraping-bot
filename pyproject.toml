[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-business-contacts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright>=1.49,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["collector"]
py-modules = ["config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
